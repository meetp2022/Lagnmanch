<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A21E31"/>
      <stop offset="100%" stop-color="#6C0E1A"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="72" fill="url(#bgGrad)"/>
  <!-- Mandap icon scaled and centered -->
  <g transform="translate(106, 60) scale(1.5)">
    <!-- Platform base -->
    <path d="M 35 77 Q 100 68 165 77" fill="none" stroke="#CDA144" stroke-width="1.5"/>
    <path d="M 25 82 Q 100 70 175 82 Q 100 76 25 82 Z" fill="#CDA144"/>
    <!-- Left pillar -->
    <rect x="55" y="38" width="10" height="30" fill="#CDA144"/>
    <rect x="52" y="38" width="16" height="4" fill="#CDA144"/>
    <rect x="52" y="64" width="16" height="4" fill="#CDA144"/>
    <!-- Right pillar -->
    <rect x="135" y="38" width="10" height="30" fill="#CDA144"/>
    <rect x="132" y="38" width="16" height="4" fill="#CDA144"/>
    <rect x="132" y="64" width="16" height="4" fill="#CDA144"/>
    <!-- Roof -->
    <path d="M 100 10 Q 75 20 48 35 L 52 38 Q 75 25 100 15 Q 125 25 148 38 L 152 35 Q 125 20 100 10 Z" fill="#CDA144"/>
    <circle cx="100" cy="10" r="4" fill="#CDA144"/>
    <circle cx="48" cy="35" r="3" fill="#CDA144"/>
    <circle cx="152" cy="35" r="3" fill="#CDA144"/>
    <!-- Curtain -->
    <path d="M 50 35 Q 75 55 100 35 Q 125 55 150 35" fill="none" stroke="#CDA144" stroke-width="3"/>
    <!-- Heart -->
    <path d="M 100 50 C 100 50 88 40 94 34 C 97 31 100 35 100 37 C 100 35 103 31 106 34 C 112 40 100 50 100 50 Z" fill="#CDA144"/>
    <!-- Couple circles -->
    <g stroke="#CDA144" stroke-width="3" fill="none">
      <circle cx="92" cy="60" r="9"/>
      <circle cx="108" cy="60" r="9"/>
    </g>
  </g>
  <!-- LM text -->
  <text x="256" y="400" font-size="120" font-weight="bold" font-family="Times New Roman, Georgia, serif" fill="#CDA144" text-anchor="middle" letter-spacing="8">LM</text>
</svg>
